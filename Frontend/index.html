<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SENSOR MONITOR - IoT System</title>
    <!-- Chart.js & FontAwesome Icons -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <meta name="theme-color" content="#f1f5f9" />
    <script src="js/theme.js?v=20261009-2"></script>
    <link rel="stylesheet" href="css/styles.css?v=20261010-4" />
  </head>
  <body>
    <!-- LOGIN PAGE -->
    <div id="login-overlay" class="login-overlay">
      <button
        type="button"
        class="theme-toggle login-theme-toggle"
        onclick="toggleTheme()"
        aria-label="Bật chế độ tối"
        aria-pressed="false"
      >
        <i class="fa-solid fa-moon theme-toggle-icon" aria-hidden="true"></i>
        <span class="theme-toggle-label">Chế độ tối</span>
      </button>
      <div class="login-card">
        <div class="login-header">
          <h1>IoT System</h1>
        </div>

        <div id="login-error" class="login-error"></div>

        <form
          id="login-form"
          inert
          class="login-form"
          onsubmit="handleLogin(event)"
        >
          <div class="form-group">
            <label for="login-username">Tên đăng nhập</label>
            <input
              type="text"
              id="login-username"
              placeholder="Nhập tên đăng nhập"
              required
            />
          </div>

          <div class="form-group">
            <label for="login-password">Mật khẩu</label>
            <input
              type="password"
              id="login-password"
              placeholder="Nhập mật khẩu"
              required
            />
          </div>

          <button id="login-submit" type="submit" class="btn-login">
            Đăng nhập
          </button>
        </form>

        <form
          id="register-form"
          inert
          class="login-form hidden"
          onsubmit="handleRegister(event)"
        >
          <div class="form-group">
            <label for="register-full-name">Họ tên</label
            ><input
              id="register-full-name"
              required
              minlength="2"
              maxlength="100"
            />
          </div>
          <div class="form-group">
            <label for="register-username">Tên đăng nhập</label
            ><input
              id="register-username"
              required
              minlength="3"
              maxlength="50"
            />
          </div>
          <div class="form-group">
            <label for="register-email">Email</label
            ><input id="register-email" type="email" />
          </div>
          <div class="form-group">
            <label for="register-password">Mật khẩu</label
            ><input
              id="register-password"
              type="password"
              required
              minlength="6"
              maxlength="72"
            />
          </div>
          <button id="register-submit" type="submit" class="btn-login">
            Đăng ký
          </button>
        </form>
        <div class="auth-switch">
          <button
            id="auth-switch-button"
            type="button"
            onclick="toggleAuthMode()"
          >
            Chưa có tài khoản? Đăng ký
          </button>
        </div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="user-profile-header">
        <img
          src="https://ui-avatars.com/api/?name=Van+Duc+Kien&background=6366f1&color=fff"
          alt="User Avatar"
          class="user-avatar"
        />
        <div class="user-info">
          <h4 id="current-username">Văn Đức Kiên</h4>
          <p id="current-role">—</p>
        </div>
      </div>

      <!-- MENU BAR -->
      <nav class="nav-menu" inert>
        <button
          class="nav-item active"
          data-tab="dashboard"
          onclick="switchTab('dashboard')"
        >
          <i class="fa-solid fa-gauge-high"></i> Dashboard
        </button>
        <button
          class="nav-item"
          data-tab="data-sensor"
          onclick="switchTab('data-sensor')"
        >
          <i class="fa-solid fa-database"></i> Data Sensor
        </button>
        <button
          class="nav-item"
          data-tab="action-history"
          onclick="switchTab('action-history')"
        >
          <i class="fa-solid fa-clock-rotate-left"></i> Action History
        </button>
        <button
          class="nav-item"
          data-tab="profile"
          onclick="switchTab('profile')"
        >
          <i class="fa-solid fa-user"></i> Profile
        </button>
      </nav>

      <button
        type="button"
        class="theme-toggle"
        onclick="toggleTheme()"
        aria-label="Bật chế độ tối"
        aria-pressed="false"
      >
        <i class="fa-solid fa-moon theme-toggle-icon"></i
        ><span class="theme-toggle-label">Chế độ tối</span>
      </button>
      <!-- LOGOUT BUTTON -->
      <div class="logout-section">
        <button class="btn-logout" onclick="handleLogout()">
          <i class="fa-solid fa-sign-out-alt"></i> Đăng xuất
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content" aria-busy="true">Đang tải nội dung...</main>

    <!-- Application logic -->
    <script src="js/config.js?v=20261009-2"></script>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="js/api.js?v=20261009-2"></script>
    <script src="js/auth.js?v=20261009-2"></script>
    <script src="js/profile.js?v=20261009-2"></script>
    <script src="js/pagination.js?v=20261009-2"></script>
    <script src="js/data-sensor.js?v=20261009-2"></script>
    <script src="js/action-history.js?v=20261009-2"></script>
    <script src="js/dashboard.js?v=20261009-2"></script>
    <script src="js/navigation.js?v=20261010-3"></script>
    <script src="js/history-layout.js?v=20261010-3"></script>
    <script src="js/app.js?v=20261010-2"></script>
  </body>
</html>
